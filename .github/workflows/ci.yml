name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    name: Mesin Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path engine/Cargo.toml
      - run: cargo build --release --manifest-path engine/Cargo.toml
      - name: Vektor emas tidak boleh berubah tanpa disengaja
        run: |
          node tools/gen_vectors.js
          git diff --exit-code shared/vectors/golden.json
      - uses: actions/upload-artifact@v4
        with:
          name: ceet-engine-linux
          path: engine/target/release/ceet-engine

  desktop:
    name: Desktop (JavaScript)
    needs: engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --manifest-path engine/Cargo.toml
      - run: cd desktop && npm test

  android:
    name: Android (Kotlin)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Terima lisensi SDK (SDK sudah ada di runner)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Pastikan Icons.kt sinkron dengan ikon desktop
        run: |
          python3 tools/gen_icons.py
          git diff --exit-code android/app/src/main/java/id/ceet/browser/ui/CeetIcons.kt
      - name: Tes unit (vektor emas Rust dan Tosh)
        run: |
          set +e
          (cd android && gradle testDebugUnitTest --no-daemon --console=plain) 2>&1 | tee /tmp/test.log
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            msg=$(grep -E '^e: |FAILED|AssertionError|Exception|What went wrong' -A2 /tmp/test.log | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Tes unit gagal::$msg"
          fi
          exit $code
      - name: Bangun APK debug
        run: |
          set +e
          (cd android && gradle assembleDebug --no-daemon --console=plain) 2>&1 | tee /tmp/build.log
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            msg=$(grep -E '^e: |What went wrong|error:' -A2 /tmp/build.log | head -80 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Build APK gagal::$msg"
          fi
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: ceet-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
      - name: Publikasikan APK ke Releases (tag latest)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Ceet-debug.apk
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest Ceet-debug.apk --prerelease --title "Ceet (build terbaru)" \
            --notes "Build otomatis dari commit ${GITHUB_SHA::7}. APK debug dengan kunci debug tetap, jadi bisa dipasang menimpa versi sebelumnya."
