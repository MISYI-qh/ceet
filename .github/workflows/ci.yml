name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    name: Mesin Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path engine/Cargo.toml
      - run: cargo build --release --manifest-path engine/Cargo.toml
      - name: Vektor emas tidak boleh berubah tanpa disengaja
        run: |
          node tools/gen_vectors.js
          git diff --exit-code shared/vectors/golden.json
      - uses: actions/upload-artifact@v4
        with:
          name: ceet-engine-linux
          path: engine/target/release/ceet-engine

  desktop:
    name: Desktop (JavaScript)
    needs: engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --manifest-path engine/Cargo.toml
      - run: cd desktop && npm test

  android:
    name: Android (Kotlin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Terima lisensi SDK (SDK sudah ada di runner)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Pastikan Icons.kt sinkron dengan ikon desktop
        run: |
          python3 tools/gen_icons.py
          git diff --exit-code android/app/src/main/java/id/ceet/browser/ui/CeetIcons.kt
      - name: Tes unit (cocokkan dengan vektor emas Rust)
        run: cd android && gradle testDebugUnitTest --no-daemon
      - name: Bangun APK debug
        run: cd android && gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ceet-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
